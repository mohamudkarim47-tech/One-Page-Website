<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My One-Page Website</title>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#video">Video</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my project website. I am learning how to structure content using HTML!</p>
    </section>

    <!-- Pictures Section -->
    <section id="gallery">
        <h2>My Gallery</h2>
        <img src="https://via.placeholder.com/200" alt="Placeholder">
    </section>

    <!-- Video Section -->
    <section id="video">
        <h2>My Video</h2>
        <iframe width="400" height="250" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video" frameborder="0" allowfullscreen></iframe>
    </section>

    <!-- Contact Form -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label>Name:</label><br>
            <input type="text"><br>
            <label>Email:</label><br>
            <input type="email"><br><br>
            <input type="submit" value="Submit">
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Student Project</p>
    </footer>

</body>
</html>
